[workspace]
resolver = "2"
members = [
    "crates/distill-core",
    "crates/distill-parse",
    "crates/distill-interp",
    "crates/distill-rules",
    "crates/distill-agents",
    "crates/distill-cli",
    "crates/distill-service",
]

[workspace.package]
version = "0.5.9"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/harshdhiman/distill"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
regex = "1"
libc = "0.2"
distill-core = { path = "crates/distill-core" }
distill-parse = { path = "crates/distill-parse" }
distill-interp = { path = "crates/distill-interp" }
distill-rules = { path = "crates/distill-rules" }
distill-agents = { path = "crates/distill-agents" }
