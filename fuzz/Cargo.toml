[package]
name = "distill-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
distill-core = { path = "../crates/distill-core" }
distill-interp = { path = "../crates/distill-interp" }
distill-rules = { path = "../crates/distill-rules" }

[[bin]]
name = "shell"
path = "fuzz_targets/shell.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
