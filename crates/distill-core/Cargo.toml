[package]
name = "distill-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared distill IDs, reports, effects, coverage and configuration types"

[dependencies]
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
hmac = { workspace = true }
regex = { workspace = true }
zeroize = "1"
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell"] }
